name: Deploy Lambda Functions and Static Assets

on:
  push:
    branches:
      - 'main'
      - 'dev'
      - 'tcely-docker-deploy'
    paths:
      - 'fetch_subscriptions.py'
      - 'oauth_start.py'
      - 'oauth_callback.py'
      - 'utils.py'
      - 'docker/**'
      - 'static/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy-lambdas:
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        function:
          - fetch_subscriptions
          - oauth_start
          - oauth_callback

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Determine Lambda function name
        id: set_lambda_name
        shell: bash
        env:
          FUNCTION: ${{ matrix.function }}
          GH_REF: ${{ github.ref }}
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          case "${GH_REF}" in
            (refs/heads/main) SUFFIX='' ;;
            (refs/heads/*) SUFFIX="_${GH_REF_NAME}" ;;
            (*) exit 1 ;;
          esac

          set_lambda_name() {
            case "${1}" in
              (fetch_subscriptions|oauth_callback|oauth_start) : ;;
              (*) exit 1 ;;
            esac
            printf -- 'lambda_name=%s%s\n' "ytsubs_${1}" "${SUFFIX}"
          } >> "${GITHUB_OUTPUT}"

          set_lambda_name "${FUNCTION}"

      - name: Prepare context for ${{ matrix.function }}
        id: prep
        shell: bash
        env:
          GH_REPO_OWNER: ${{ github.repository_owner }}
        run: |
          echo "owner_lowercase=${GH_REPO_OWNER,,}" >> "${GITHUB_OUTPUT}"
          
          # Construct the targeted directory space
          TARGET_DIR='docker/contexts/${{ matrix.function }}'
          mkdir -v -p "${TARGET_DIR}"
          echo "context_directory=${TARGET_DIR}" >> "${GITHUB_OUTPUT}"
          
          # Copy using the strict verbose, preserve, and target-directory flags
          cp -v -p -t "${TARGET_DIR}/" "${{ matrix.function }}.py" 'utils.py'

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up AWS credentials
        if: github.ref_name != 'tcely-docker-deploy'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy ${{ matrix.function }}
        if: github.ref_name != 'tcely-docker-deploy'
        run: |
          zip ${{ matrix.function }}.zip ${{ matrix.function }}.py utils.py
          aws lambda update-function-code \
            --function-name "${{ steps.set_lambda_name.outputs.lambda_name }}" \
            --zip-file "fileb://${{ matrix.function }}.zip"

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          build-contexts: |
            lambda_src=./${{ steps.prep.outputs.context_directory }}
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.prep.outputs.owner_lowercase }}/ytsubs:${{ matrix.function }}
          target: ${{ matrix.function }}
          build-args: |
            PYTHON_VERSION=3.11
            LAMBDA_FUNCTION=${{ matrix.function }}.lambda_handler
            LAMBDA_FUNCTION_NAME=${{ steps.set_lambda_name.outputs.lambda_name }}

  upload-assets:
    if: github.ref == 'refs/heads/main'
    needs: deploy-lambdas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload static assets to S3
        run: |
          aws s3 cp static/ s3://$S3_BUCKET_NAME/ --recursive
        env:
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}

      - name: Invalidate CloudFront cache # Force static assets to refresh upon push
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
